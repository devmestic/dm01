name: Build Full Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "v3-build-work" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Materialize v3 native source
        shell: bash
        run: |
          mkdir -p app/src/main/java/dev/chanwoo/rhodesreader
          cat scripts/v3src_00.b64 scripts/v3src_01.b64 scripts/v3src_02.b64 scripts/v3src_03.b64 scripts/v3src_04.b64 scripts/v3src_05.b64 scripts/v3src_06.b64 scripts/v3src_07.b64 | tr -d '\r\n' | base64 -d > app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          test -s app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          grep -q "class MainActivity" app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          grep -q "class MediaCatalog" app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          sha256sum app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java | tee v3-source.sha256
          wc -c app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java

      - name: Validate runtime remains offline
        run: |
          ! grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml
          ! grep -R "android.webkit.WebView" -n app/src/main/java
          ! grep -R "https://\|http://" -n app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          grep -q "versionName '3.0.0'" app/build.gradle

      - name: Fetch latest Korean story data
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/050644zf/ArknightsStoryJson.git upstream-story
          git -C upstream-story sparse-checkout set ko_KR/gamedata/story img/banners

      - name: Index story image repository without checkout
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/fexli/ArknightsResource.git upstream-images
          git -C upstream-images rev-parse HEAD

      - name: Index story audio repository without checkout
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout --branch global-server-voices https://github.com/PseudoMon/arknights-audio.git upstream-audio
          git -C upstream-audio rev-parse HEAD

      - name: Build selective full local media pack
        run: |
          python3 scripts/prepare_full_assets.py upstream-story upstream-images upstream-audio | tee full-media-report.txt
          echo "---- media stats ----"
          python3 - <<'PY'
          import json
          d=json.load(open('app/src/main/assets/media_index.json', encoding='utf-8'))
          print(json.dumps(d['stats'], ensure_ascii=False, indent=2))
          stats=d['stats']
          assert stats['storyCount'] >= 1800
          assert stats['backgroundFound'] + stats['imageFound'] + stats['characterFound'] > 0
          PY
          du -sh app/src/main/assets
          test -s app/src/main/assets/story_index.json
          test -s app/src/main/assets/media_index.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build v3 full offline APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RhodesReaderKR-v3.0.0-full-offline.apk
          unzip -l RhodesReaderKR-v3.0.0-full-offline.apk | grep -q "assets/story_index.json"
          unzip -l RhodesReaderKR-v3.0.0-full-offline.apk | grep -q "assets/media_index.json"
          unzip -l RhodesReaderKR-v3.0.0-full-offline.apk | grep -q "assets/story/"
          unzip -l RhodesReaderKR-v3.0.0-full-offline.apk | grep -q "assets/media/images/"
          sha256sum RhodesReaderKR-v3.0.0-full-offline.apk | tee RhodesReaderKR-v3.0.0-full-offline.apk.sha256
          ls -lh RhodesReaderKR-v3.0.0-full-offline.apk

      - name: Upload full offline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhodesReaderKR-v3.0.0-full-offline
          path: |
            RhodesReaderKR-v3.0.0-full-offline.apk
            RhodesReaderKR-v3.0.0-full-offline.apk.sha256
            full-media-report.txt
            app/src/main/assets/media_index.json
            v3-source.sha256
          compression-level: 0
          retention-days: 30
