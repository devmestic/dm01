name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Fetch latest Korean story data
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/050644zf/ArknightsStoryJson.git upstream-story
          git -C upstream-story sparse-checkout set ko_KR/gamedata/story
          python3 scripts/prepare_story_assets.py upstream-story
          du -sh app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build offline debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RhodesReaderKR-v2.0.0-offline.apk

      - name: Verify APK contains offline story assets
        run: |
          unzip -l RhodesReaderKR-v2.0.0-offline.apk | grep -q "assets/story_index.json"
          unzip -l RhodesReaderKR-v2.0.0-offline.apk | grep -q "assets/story/"
          echo "Offline assets verified"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhodesReaderKR-v2.0.0-offline
          path: RhodesReaderKR-v2.0.0-offline.apk

      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Rhodes Reader KR v2.0.0 · Offline Native
          body: |
            Fully offline native Android reader for Korean Arknights stories.

            - No WebView
            - No INTERNET permission
            - Full ko_KR story JSON dataset packaged inside the APK at build time
            - Native event/story browser and search
            - Native dialog, narration and choice rendering
            - Reading position persistence
            - Bookmarks and text-size controls
          files: RhodesReaderKR-v2.0.0-offline.apk
          make_latest: true
