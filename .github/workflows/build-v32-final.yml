name: Build v3.2 Final Private 100 Percent Offline APK

on:
  push:
    branches: ["v3.2-build-private"]
    paths: ["V32_FINAL_BUILD_TRIGGER"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Materialize v3 native source
        shell: bash
        run: |
          mkdir -p app/src/main/java/dev/chanwoo/rhodesreader
          cat scripts/v3src_00.b64 scripts/v3src_01.b64 scripts/v3src_02.b64 scripts/v3src_03.b64 scripts/v3src_04.b64 scripts/v3src_05.b64 scripts/v3src_06.b64 scripts/v3src_07.b64 | tr -d '\r\n' | base64 -d > app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          test -s app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          grep -q 'class MainActivity' app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          sed -i -E 's/Rhodes Reader KR 3\.[01]\.0/Rhodes Reader KR 3.2.0/g' app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          sha256sum app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java | tee v32-source.sha256

      - name: Validate final private offline runtime
        run: |
          ! grep -R 'android.permission.INTERNET' -n app/src/main/AndroidManifest.xml
          ! grep -R 'android.webkit.WebView' -n app/src/main/java
          ! grep -R 'https://\|http://' -n app/src/main/java/dev/chanwoo/rhodesreader/MainActivity.java
          grep -q "versionName '3.2.0'" app/build.gradle
          grep -q 'versionCode 30200' app/build.gradle

      - name: Fetch latest Korean story data
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/050644zf/ArknightsStoryJson.git upstream-story
          git -C upstream-story sparse-checkout set ko_KR/gamedata/story img/banners

      - name: Index baseline image and audio sources
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/fexli/ArknightsResource.git upstream-images
          git clone --depth=1 --filter=blob:none --no-checkout --branch global-server-voices https://github.com/PseudoMon/arknights-audio.git upstream-audio

      - name: Build baseline media pack
        run: |
          python3 scripts/prepare_full_assets.py upstream-story upstream-images upstream-audio | tee full-media-report.txt
          du -sh app/src/main/assets

      - name: Index supplemental static sources
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/Aceship/Arknight-Images.git upstream-aceship
          git clone --depth=1 --filter=blob:none --no-checkout --branch cn https://github.com/ArknightsAssets/ArknightsAssets2.git upstream-assets2
          git clone --depth=1 --filter=blob:none --no-checkout --branch main https://github.com/PseudoMon/arknights-audio.git upstream-audio-main

      - name: Supplement static media coverage
        run: |
          python3 scripts/supplement_media_v31.py upstream-images upstream-aceship upstream-assets2 upstream-audio-main | tee supplement-v31-report.txt
          python3 - <<'PY'
          import json
          s=json.load(open('app/src/main/assets/media_index.json',encoding='utf-8'))['stats']
          print(json.dumps({k:v for k,v in s.items() if k.startswith('v31_')},ensure_ascii=False,indent=2))
          assert s['v31_backgroundFound'] == s['v31_backgroundRequested']
          assert s['v31_imageFound'] >= 1326
          assert s['v31_characterFound'] >= 9000
          PY

      - name: Install official bundle extractor
        run: python3 -m pip install --index-url https://pypi.org/simple 'UnityPy~=1.25' 'lz4~=4.4' pillow

      - name: Recover missing character sprites from current official KR bundles
        run: |
          python3 scripts/supplement_official_images_v32.py | tee official-images-v32-report.txt
          python3 - <<'PY'
          import json
          r=json.load(open('v32-official-image-report.json',encoding='utf-8'))
          print(json.dumps({k:r[k] for k in ('resVersion','requested','foundAfter','missingAfter')},ensure_ascii=False,indent=2))
          print('official recovered',len(r.get('recovered',{})),'unresolved',len(r.get('unresolved',{})),'bundleErrors',len(r.get('bundleErrors',[])))
          assert not r.get('bundleErrors')
          PY

      - name: Recover any remaining exact historical AVG images
        run: |
          python3 scripts/recover_historical_images_v32.py | tee historical-images-v32-report.txt
          test -s v32-historical-image-report.json

      - name: Fetch latest KR story variables
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/ArknightsAssets/ArknightsGamedata.git upstream-gamedata
          git -C upstream-gamedata sparse-checkout set kr/gamedata/story
          cp upstream-gamedata/kr/gamedata/story/story_variables.json story_variables_kr.json
          test -s story_variables_kr.json

      - name: Rebuild audio from current official KR Hot Update
        run: |
          python3 scripts/supplement_official_audio_v32.py app/src/main/assets/story story_variables_kr.json | tee official-audio-v32-report.txt
          python3 - <<'PY'
          import json
          r=json.load(open('v32-official-audio-report.json',encoding='utf-8'))
          s=r['stats']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          assert s['v32_musicFound'] >= 439
          assert s['v32_sfxFound'] >= 1325
          assert not s['v32OfficialAudioErrors']
          PY

      - name: Recover aliases and surviving official CN Monster Hunter BGM
        run: python3 scripts/supplement_legacy_audio_v32.py | tee legacy-audio-v32-report.txt

      - name: Recover deleted Monster Hunter audio from upstream Git history
        run: |
          python3 scripts/recover_historical_mh_audio_v32.py | tee historical-mh-audio-v32-report.txt
          python3 - <<'PY'
          import json
          r=json.load(open('v32-historical-mh-audio-report.json',encoding='utf-8'))
          print(json.dumps(r['stats'],ensure_ascii=False,indent=2))
          assert r['stats']['musicRecovered'] == 8
          assert r['stats']['sfxRecovered'] == 69
          assert not r['missing']['music']
          assert not r['missing']['sfx']
          PY

      - name: Strict semantic 100 percent coverage gate
        run: python3 scripts/final_coverage_v32.py | tee v32-final-coverage.txt

      - name: Prepare optimization tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Optimize media for APK
        run: |
          python3 scripts/optimize_media_pack.py | tee optimize-media-report.txt
          python3 - <<'PY'
          import json
          s=json.load(open('app/src/main/assets/media_index.json',encoding='utf-8'))['stats']
          print('optimized bytes',s['totalAssetBytesAfterOptimization'])
          assert s['optimizedForApk'] is True
          assert s['totalAssetBytesAfterOptimization'] < 3_600_000_000
          assert len(s.get('audioOptimizationErrors',[])) == 0
          PY
          du -sh app/src/main/assets

      - name: Verify coverage survived optimization
        run: python3 scripts/final_coverage_v32.py | tee v32-final-coverage-after-optimize.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build final v3.2 private APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage and verify final APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RhodesReaderKR-v3.2.0-final-private-offline.apk
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/story_index.json'
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/media_index.json'
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/story/'
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/media/images/'
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/media/audio/'
          sha256sum RhodesReaderKR-v3.2.0-final-private-offline.apk | tee RhodesReaderKR-v3.2.0-final-private-offline.apk.sha256
          ls -lh RhodesReaderKR-v3.2.0-final-private-offline.apk

      - name: Upload final private APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhodesReaderKR-v3.2.0-final-private-offline
          path: |
            RhodesReaderKR-v3.2.0-final-private-offline.apk
            RhodesReaderKR-v3.2.0-final-private-offline.apk.sha256
            v32-final-coverage.json
            v32-final-coverage.txt
            v32-final-coverage-after-optimize.txt
            v32-official-image-report.json
            v32-historical-image-report.json
            v32-official-audio-report.json
            v32-legacy-audio-report.json
            v32-historical-mh-audio-report.json
            full-media-report.txt
            supplement-v31-report.txt
            official-images-v32-report.txt
            historical-images-v32-report.txt
            official-audio-v32-report.txt
            legacy-audio-v32-report.txt
            historical-mh-audio-v32-report.txt
            optimize-media-report.txt
            app/src/main/assets/media_index.json
            v32-source.sha256
          compression-level: 0
          retention-days: 30
