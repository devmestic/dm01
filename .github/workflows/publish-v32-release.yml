name: Publish verified v3.2 release

on:
  push:
    branches: [ "v3.2-finalize" ]
    paths:
      - '.github/release-v32-trigger'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout publisher config
        uses: actions/checkout@v4

      - name: Read verified build run
        id: source
        shell: bash
        run: |
          RUN_ID=$(tr -dc '0-9' < .github/release-v32-trigger)
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing artifact from run $RUN_ID"

      - name: Download verified APK artifact
        uses: actions/download-artifact@v5
        with:
          name: RhodesReaderKR-v3.2.0-final-private-offline
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify APK and checksum
        shell: bash
        run: |
          cd release
          test -s RhodesReaderKR-v3.2.0-final-private-offline.apk
          test -s RhodesReaderKR-v3.2.0-final-private-offline.apk.sha256
          sha256sum -c RhodesReaderKR-v3.2.0-final-private-offline.apk.sha256
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/story_index.json'
          unzip -l RhodesReaderKR-v3.2.0-final-private-offline.apk | grep -q 'assets/media_index.json'
          sha256sum RhodesReaderKR-v3.2.0-final-private-offline.apk
          ls -lh RhodesReaderKR-v3.2.0-final-private-offline.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: Rhodes Reader KR v3.2.0
          target_commitish: v3.2-finalize
          make_latest: true
          body: |
            Rhodes Reader KR v3.2.0 final offline build.

            - Native Android app, no WebView
            - No INTERNET permission at runtime
            - Korean story data bundled offline
            - Story media reference coverage gate: background 100%, story image 100%, character 100%, BGM 100%, SFX 100%
            - Removed legacy character expressions are recovered from historical archives where available; three no-longer-published expressions use same-character compatibility aliases so no story image slot is blank.

            The accompanying .sha256 file is generated by the verified build run.
          files: |
            release/RhodesReaderKR-v3.2.0-final-private-offline.apk
            release/RhodesReaderKR-v3.2.0-final-private-offline.apk.sha256
          fail_on_unmatched_files: true
