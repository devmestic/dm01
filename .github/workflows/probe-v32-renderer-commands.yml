name: Probe v3.2 renderer image commands
on:
  push:
    branches: ["v3.2-build-private"]
    paths: ["V32_RENDERER_PROBE_TRIGGER"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect renderer
        run: |
          cat scripts/v3src_00.b64 scripts/v3src_01.b64 scripts/v3src_02.b64 scripts/v3src_03.b64 scripts/v3src_04.b64 scripts/v3src_05.b64 scripts/v3src_06.b64 scripts/v3src_07.b64 | tr -d '\r\n' | base64 -d > /tmp/MainActivity.java
          grep -ni -C 8 -E 'imagetween|hidecgitem|showcgitem|prop.equals\("image"\)|case "image"' /tmp/MainActivity.java || true
