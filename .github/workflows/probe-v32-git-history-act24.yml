name: Probe v3.2 deleted Monster Hunter assets

on:
  push:
    branches: ["v3.2-official-audio"]
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository histories without blobs
        run: |
          set -o pipefail
          : > v32-git-history-act24.txt
          for repo in ArknightsAssets/ArknightsAssets2 ArknightsAssets/ArknightsAssets fexli/ArknightsResource; do
            dir=$(echo "$repo" | tr '/' '_')
            echo "### $repo" | tee -a v32-git-history-act24.txt
            git clone --filter=blob:none --no-checkout "https://github.com/$repo.git" "$dir"
            git -C "$dir" log --all --name-only --pretty=format: | grep -iE 'act24side|m_bat_mhrors|m_avg_act24side' | sort -u | tee -a v32-git-history-act24.txt || true
            rm -rf "$dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: v32-git-history-act24-probe
          path: v32-git-history-act24.txt
          retention-days: 7
