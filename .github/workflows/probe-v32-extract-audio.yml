name: Probe v3.2 extract KR audio

on:
  push:
    branches: ["v3.2-official-audio"]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current KR CDN and download sample bundles
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,zipfile,os
          from pathlib import Path
          def gj(u):
              r=urllib.request.Request(u,headers={'User-Agent':'RhodesReaderKR-v3.2-extract'})
              with urllib.request.urlopen(r,timeout=60) as x:return json.load(x)
          o=gj('https://ak-conf.arknights.kr/config/prod/official/network_config')
          c=json.loads(o['content']);n=c['configs'][c['funcVer']]['network']
          v=gj(n['hv'].replace('{0}','Android'));res=v['resVersion'];base=f"{n['hu']}/Android/assets/{res}"
          names=['audio/sound_beta_2/music/act25side/m_avg_decisivebattle.ab','audio/sound_beta_2/avg_se_0.ab']
          Path('samples').mkdir()
          for name in names:
              dat=name.replace('/','_').replace('#','__').split('.')[0]+'.dat'
              url=base+'/'+dat
              print('DOWNLOAD',name,url)
              req=urllib.request.Request(url,headers={'User-Agent':'RhodesReaderKR-v3.2-extract'})
              with urllib.request.urlopen(req,timeout=120) as r,open('samples/'+dat,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b:break
                      f.write(b)
              print('DAT BYTES',os.path.getsize('samples/'+dat))
              with zipfile.ZipFile('samples/'+dat) as z:
                  print('ZIP',z.namelist())
                  z.extractall('samples/unpacked')
          print('resVersion',res)
          PY

      - name: Install minimal extraction dependencies
        shell: bash
        run: |
          python3 -m pip install --index-url https://pypi.org/simple 'UnityPy~=1.25' 'lz4~=4.4'

      - name: Extract sample AudioClips with LZ4AK patch
        shell: bash
        run: |
          rm -rf extracted && mkdir extracted
          python3 - <<'PY'
          from pathlib import Path
          import lz4.block
          import UnityPy
          from UnityPy.enums.BundleFile import CompressionFlags
          from UnityPy.helpers import CompressionHelper

          def extra(data,pos,end):
              n=0
              while pos<end:
                  b=data[pos]; n+=b; pos+=1
                  if b!=0xff: break
              return n,pos

          def lz4ak(src,usize):
              ip=op=0; buf=bytearray(src); end=len(buf)
              while ip<end:
                  literal=buf[ip]&0xF; match=(buf[ip]>>4)&0xF
                  buf[ip]=(literal<<4)|match; ip+=1
                  if literal==0xF:
                      x,ip=extra(buf,ip,end); literal+=x
                  ip+=literal; op+=literal
                  if op>=usize: break
                  off=(buf[ip]<<8)|buf[ip+1]
                  buf[ip]=off&0xff; buf[ip+1]=(off>>8)&0xff; ip+=2
                  if match==0xF:
                      x,ip=extra(buf,ip,end); match+=x
                  match+=4; op+=match
              return lz4.block.decompress(buf,uncompressed_size=usize)

          CompressionHelper.DECOMPRESSION_MAP[CompressionFlags.LZHAM]=lz4ak
          out=Path('extracted')
          count=0
          for fp in Path('samples/unpacked').rglob('*.ab'):
              print('OPEN',fp)
              env=UnityPy.load(str(fp))
              for obj in env.objects:
                  if obj.type.name!='AudioClip': continue
                  clip=obj.parse_as_object()
                  print('AUDIOCLIP',clip.m_Name)
                  for name,data in clip.samples.items():
                      safe=Path(name).name
                      dest=out/safe
                      if dest.exists():
                          dest=out/(fp.stem+'__'+safe)
                      dest.write_bytes(data)
                      print('WRITE',dest,len(data))
                      count+=1
          print('TOTAL_EXTRACTED',count)
          if count==0: raise SystemExit('no audio extracted')
          PY
          find extracted -type f -printf '%P\t%s\n' | sort | tee v32-extracted-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v32-audio-extract-probe
          path: v32-extracted-files.txt
          retention-days: 7
