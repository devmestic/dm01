name: Probe v3.2 PRTS legacy images

on:
  push:
    branches: [ "v3.2-finalize" ]
    paths:
      - '.github/workflows/probe-v32-prts-legacy.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search PRTS file namespace for legacy AVG names
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          terms=['nearl','jessica','jesca','jesica']
          for term in terms:
              q=urllib.parse.urlencode({'action':'query','format':'json','list':'search','srsearch':term,'srnamespace':'6','srlimit':'500'})
              req=urllib.request.Request('https://prts.wiki/api.php?'+q,headers={'User-Agent':'RhodesReaderKR-v3.2-probe'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:d=json.load(r)
                  hits=d.get('query',{}).get('search',[])
                  print('TERM',term,'COUNT',len(hits))
                  for x in hits:
                      title=str(x.get('title') or '')
                      if 'avg' in title.lower(): print('TITLE|'+title)
              except Exception as e: print('TERM_ERROR',term,repr(e))
          PY
