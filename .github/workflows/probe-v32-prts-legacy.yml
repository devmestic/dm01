name: Probe v3.2 PRTS legacy images

on:
  push:
    branches: [ "v3.2-finalize" ]
    paths:
      - '.github/workflows/probe-v32-prts-legacy.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query PRTS legacy AVG image index
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          prefixes = [
              'Avg_avg_148_nearl',
              'Avg_avg_1502_crowns',
              'Avg_avg_242_mayer',
              'Avg_avg_242_otter',
              'Avg_avg_259_jessica',
              'Avg_avg_259_Jessica',
              'Avg_avg_201_moeshd',
              'Avg_avg_219_meteo',
          ]
          for prefix in prefixes:
              q = urllib.parse.urlencode({
                  'action':'query','format':'json','list':'allimages',
                  'aiprefix':prefix,'ailimit':'500','aiprop':'url|size'
              })
              url='https://prts.wiki/api.php?'+q
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'RhodesReaderKR-v3.2-probe'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      d=json.load(r)
                  imgs=d.get('query',{}).get('allimages',[])
                  print('PREFIX',prefix,'COUNT',len(imgs))
                  for x in imgs:
                      print('IMAGE|'+str(x.get('name'))+'|'+str(x.get('url'))+'|'+str(x.get('size')))
              except Exception as e:
                  print('PREFIX_ERROR',prefix,repr(e))
          PY
