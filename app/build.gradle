plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.chanwoo.rhodesreader'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.chanwoo.rhodesreader'
        minSdk 26
        targetSdk 36
        versionCode 20000
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
